name: Market Price & Options Radar

on:
  schedule:
    # Runs every 30 minutes, 24/7/365
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alert Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PRICE_WEBHOOK_URL: ${{ secrets.DISCORD_PRICE_WEBHOOK_URL }}
          DISCORD_OPTIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPTIONS_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit and Push State Memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Self-healing retry loop (up to 5 automatic attempts)
          for i in {1..5}; do
            git add alerts_state.json || true
            git commit -m "Update alert price state [skip ci]" || echo "No local changes to commit"
            
            # Pull latest commits and auto-resolve any concurrent edits cleanly
            if git pull --rebase -X theirs origin main; then
              if git push origin main; then
                echo "✅ Successfully synced and pushed state memory on attempt $i"
                exit 0
              fi
            else
              echo "⚠️ Rebase conflict encountered on attempt $i. Aborting rebase and retrying..."
              git rebase --abort || true
            fi
            
            echo "Pausing 3s before retry $i/5..."
            sleep 3
          done
          
          echo "❌ Failed to push after 5 attempts."
          exit 1
