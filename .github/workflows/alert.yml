name: Run Market Alert Bot

on:
  push:
    branches:
      - main  # Automatically triggers a fresh run whenever you save/commit to main
  schedule:
    - cron: '*/15 * * * *'  # Runs automatically every 15 minutes 24/7
  workflow_dispatch:        # Allows manual triggers anytime

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Alert Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
