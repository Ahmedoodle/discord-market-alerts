name: Run Daily Earnings Radar

on:
  workflow_dispatch:   # <--- This allows cron-job.org to trigger it instantly
  # You can remove or keep the schedule block

jobs:
  run-earnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install requests yfinance pandas
      - name: Run Script
        env:
          DISCORD_EARNINGS_WEBHOOK_URL: ${{ secrets.DISCORD_EARNINGS_WEBHOOK_URL }}
        run: python earnings.py
